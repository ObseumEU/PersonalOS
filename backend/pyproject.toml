[project]
name = "personalos"
version = "0.1.0"
description = "PersonalOS API: daily-use hub for files, topics, tasks, calendar and the assistant"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "itsdangerous>=2.2",
    "pydantic-settings>=2.4",
    "mcp>=2.2,<3",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
