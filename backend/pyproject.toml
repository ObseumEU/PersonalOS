[project]
name = "personalos"
version = "0.4.0"
description = "PersonalOS API: daily-use hub for files, topics, tasks, calendar and the assistant"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "itsdangerous>=2.2",
    "pydantic-settings>=2.4",
    "mcp>=2.2,<3",
    "tzdata>=2024.1",
    "httpx>=0.27",
    "icalendar>=6",
    "recurring-ical-events>=3",
    "python-multipart>=0.0.9",
    # Home Assistant's WebSocket API (pos.homeassistant); uvicorn[standard] brings it too.
    "websockets>=13",
    # SSH to the Home Assistant host with a password from 1Password (pos.homeassistant.ha_ssh).
    "paramiko>=3.4",
    # Web Push to the installed app (pos.push): VAPID signing and payload encryption.
    "pywebpush>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-xdist>=3.5", "httpx>=0.27", "ruff~=0.16.0"]
# Text extraction from PDFs for full-text search (optional; pos.files skips PDFs without it).
pdf = ["pypdf>=4"]
# 1Password service account for agents' credentials (pos.credentials); the api image installs it.
onepassword = ["onepassword-sdk>=0.4"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# ../worker: the worker package (pos_worker) is importable without installing it or a PYTHONPATH.
pythonpath = ["src", "../worker"]
