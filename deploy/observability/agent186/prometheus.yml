# Prometheus on 192.168.1.186 (obs-platform). Most series arrive by remote write from the two
# Alloys (svr03 and this host); Prometheus itself only scrapes the blackbox probes and itself.
global:
  scrape_interval: 60s
  evaluation_interval: 60s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
        labels: {host: agent}

  - job_name: blackbox
    metrics_path: /probe
    params:
      module: [http_2xx]
    scrape_interval: 60s
    scrape_timeout: 15s
    static_configs:
      - targets: ["https://personalos.obseum.cz/api/health"]
        labels: {app: personalos, host: svr03}
      - targets: ["https://knowlage.obseum.cz/api/health"]
        labels: {app: knowlage, host: svr03}
      - targets: ["https://nexus-api.obseum.cloud/readyz"]
        labels: {app: nexus-api, host: svr03}
      - targets: ["https://nexus.obseum.cloud/"]
        labels: {app: nexus-web, host: svr03}
      - targets: ["https://litellm.obseum.cloud/health/liveliness"]
        labels: {app: litellm, host: svr03}
      - targets: ["https://langfuse.obseum.cloud/api/public/health"]
        labels: {app: langfuse, host: svr03}
      - targets: ["https://grafana.obseum.cloud/api/health"]
        labels: {app: grafana-proxy, host: svr03}
      - targets: ["https://tesco.obseum.cz/api/health"]
        labels: {app: tesco, host: svr03}
      - targets: ["https://chatpulse.obseum.cz/"]
        labels: {app: chatpulse, host: svr03}
      - targets: ["https://audexia.obseum.cz/"]
        labels: {app: audexia, host: svr03}
      - targets: ["http://grafana:3000/api/health"]
        labels: {app: grafana, host: agent}
      - targets: ["http://loki:3100/ready"]
        labels: {app: loki, host: agent}
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: obs-blackbox:9115

  # svr03 reachable at all (alert "svr03 down", paged to the phone through Home Assistant).
  - job_name: blackbox_icmp
    metrics_path: /probe
    params:
      module: [icmp]
    scrape_interval: 30s
    scrape_timeout: 10s
    static_configs:
      - targets: ["192.168.1.108"]
        labels: {app: svr03-ping, host: svr03}
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: obs-blackbox:9115
