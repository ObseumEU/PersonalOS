# Split-horizon names: the internal (LAN/VPN-only) sites served by svr03's Caddy.
# Single source of truth, deployed verbatim to BOTH resolvers:
#   - svr03 dnsmasq (LAN clients)        -> /opt/server/network-dns/obseum-internal.conf
#   - VPN hub dnsmasq on 23.88.52.230    -> /etc/dnsmasq.d/obseum-internal.conf  (VPN clients, DNS 10.66.66.1)
# Outside (no VPN) these names resolve publicly (Namecheap -> 23.88.52.230) and Caddy
# answers 403, because everything arriving through the VPS is seen as 10.66.66.1.
#
# Only LAN-only sites are listed on purpose. Public sites (obseum.cz, rodinne-pribehy,
# audexia, eplus, call, ...) keep their public answer so behaviour does not change for them.
# Adding an internal site: add a line here, then run deploy/network/deploy.sh.

