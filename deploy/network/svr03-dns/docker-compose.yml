# Deployed to svr03:/opt/server/network-dns (see deploy/network/deploy.sh).
# Rollback: docker compose down  (nothing on the LAN depends on it until a device is pointed at it).
services:
  lan-dns:
    build: .
    image: local/lan-dns:1
    container_name: lan-dns
    network_mode: host
    cap_add: [NET_BIND_SERVICE]
    restart: unless-stopped
    volumes:
      - ./dnsmasq.conf:/etc/dnsmasq.conf:ro
      - ./obseum-internal.conf:/etc/dnsmasq.d/obseum-internal.conf:ro
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }
