# LAN resolver on svr03 (split horizon). Answers the internal obseum names with the
# LAN address of svr03's Caddy and forwards everything else upstream.
# Binds only to svr03's LAN addresses (never the public IPv6 / docker bridges).
listen-address=192.168.1.108
listen-address=fd72:b840:a00e:8:da9e:f3ff:fe2e:18e
bind-dynamic
no-resolv
no-hosts
domain-needed
bogus-priv
cache-size=2000
# Upstreams: public resolvers + the Starlink router (which also knows the DHCP names under .lan).
server=1.1.1.1
server=9.9.9.9
server=192.168.1.1
server=/lan/192.168.1.1
server=/1.168.192.in-addr.arpa/192.168.1.1
conf-file=/etc/dnsmasq.d/obseum-internal.conf
