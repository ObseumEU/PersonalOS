# PersonalOS stack. Works on the laptop as-is; on the server add
# docker-compose.prod.yml (see README).
services:
  api:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      # Agent instructions from git override the first version (AGENTS-SPEC 6).
      POS_AGENTS_REPO_DIR: /repo-agents
      # Runtimes: auto = codex first, claude (Opus 5.5) as fallback.
      POS_AGENT_RUNTIME: ${POS_AGENT_RUNTIME:-auto}
      POS_ENGINE_ORDER: ${POS_ENGINE_ORDER:-codex,claude}
      POS_CODEX_MODEL: ${POS_CODEX_MODEL:-}
      POS_CLAUDE_MODEL: ${POS_CLAUDE_MODEL:-claude-opus-5-5}
      POS_KNOWLAGE_URL: ${POS_KNOWLAGE_URL:-https://knowlage.obseum.cz}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
    volumes:
      - pos-data:/data
      - ./agents:/repo-agents:ro
    restart: unless-stopped

  web:
    build: ./web
    depends_on:
      - api
    ports:
      - "${POS_PORT:-8080}:80"
    restart: unless-stopped

  # --- Deployer (AGENTS-SPEC step 6): ships what agents merge to main, reverts
  # it automatically when the constitution check, tests or health fail.
  # Runs on the server's checkout:  docker compose --profile deploy up -d
  deployer:
    profiles: ["deploy"]
    build:
      context: .
      dockerfile: ops/deployer.Dockerfile
    depends_on: [api]
    working_dir: /repo
    command: ["python", "-m", "pos.selfdeploy", "--repo", "/repo", "--watch", "60"]
    environment:
      POS_URL: http://api:8000
      POS_DEPLOYER_KEY: ${DEPLOYER_KEY:-}
      DEPLOY_HEALTH_URL: http://web/api/health
      DEPLOY_TEST_CMD: ${DEPLOY_TEST_CMD:-cd backend && pip install -q -e .[dev] && python -m pytest -q}
      DEPLOY_UP_CMD: ${DEPLOY_UP_CMD:-docker compose up -d --build api web}
    volumes:
      - .:/repo
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  # --- Agents: each one is its own Codex worker app (AGENTS-SPEC step 3).
  # Start with:  docker compose --profile agents up -d --build
  # Keys come from the agent's page (New key); Codex login from CODEX_HOME_HOST.
  dev-agent:
    profiles: ["agents"]
    build: ./worker
    depends_on: [api]
    environment:
      POS_URL: http://api:8000
      POS_AGENT_KEY: ${DEV_AGENT_KEY:-}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      # More MCP servers for this agent (knowlage ingest, GitHub, Gmail, Discord), '||' between entries.
      WORKER_CODEX_CONFIG: '${DEV_AGENT_CODEX_CONFIG:-mcp_servers.pos.enabled_tools=["get_task","report_progress","complete_task","ack_message","request_approval","create_task","handoff_task"]||model_reasoning_effort="medium"}'
      KB_AGENT_KEY: ${DEV_KB_AGENT_KEY:-}
      GITHUB_TOKEN: ${DEV_GITHUB_TOKEN:-}
      # Token budget (agents/dev-agent/INSTRUCTIONS.md): only the pos tools it uses, medium effort,
      # a cost cap per Claude run and a step cap per run.
      WORKER_CLAUDE_TOOLS: 'mcp__pos__get_task|mcp__pos__report_progress|mcp__pos__complete_task|mcp__pos__ack_message|mcp__pos__request_approval|mcp__pos__create_task|mcp__pos__handoff_task|Read|Glob|Grep|Write|Edit'
      WORKER_CLAUDE_DISALLOWED: 'mcp__pos__ask_agent mcp__pos__assign_task mcp__pos__capture mcp__pos__check_inbox mcp__pos__claim_task mcp__pos__create_agent mcp__pos__emit_event mcp__pos__freeze mcp__pos__get_agent_status mcp__pos__heartbeat mcp__pos__hr_admit_agent mcp__pos__hr_overview mcp__pos__hr_review mcp__pos__hr_weekly_report mcp__pos__list_active_runs mcp__pos__list_routes mcp__pos__list_tasks mcp__pos__request_outbound mcp__pos__schedule_create mcp__pos__schedule_delete mcp__pos__schedule_list mcp__pos__schedule_pause mcp__pos__schedule_resume mcp__pos__schedule_run_now mcp__pos__schedule_update mcp__pos__send_message mcp__pos__update_task'
      WORKER_CLAUDE_EFFORT: medium
      WORKER_CLAUDE_MAX_USD: "6"
      WORKER_MAX_STEPS: "90"
    volumes:
      - ${CODEX_HOME_HOST:-./data/codex}:/codex
      - dev-agent-work:/work
    restart: unless-stopped

  assistant:
    profiles: ["agents"]
    build: ./worker
    depends_on: [api]
    environment:
      POS_URL: http://api:8000
      POS_AGENT_KEY: ${ASSISTANT_AGENT_KEY:-}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
    volumes:
      - ${CODEX_HOME_HOST:-./data/codex}:/codex
      - assistant-work:/work
    restart: unless-stopped

  mail-agent:
    profiles: ["agents"]
    build: ./worker
    depends_on: [api]
    environment:
      POS_URL: http://api:8000
      POS_AGENT_KEY: ${MAIL_AGENT_KEY:-}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      # More MCP servers for this agent (knowlage ingest, GitHub, Gmail, Discord), '||' between entries.
      WORKER_CODEX_CONFIG: ${MAIL_AGENT_CODEX_CONFIG:-}
      KB_AGENT_KEY: ${MAIL_KB_AGENT_KEY:-}
    volumes:
      - ${CODEX_HOME_HOST:-./data/codex}:/codex
      - mail-agent-work:/work
    restart: unless-stopped

  community-agent:
    profiles: ["agents"]
    build: ./worker
    depends_on: [api]
    environment:
      POS_URL: http://api:8000
      POS_AGENT_KEY: ${COMMUNITY_AGENT_KEY:-}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      # More MCP servers for this agent (knowlage ingest, GitHub, Gmail, Discord), '||' between entries.
      WORKER_CODEX_CONFIG: ${COMMUNITY_AGENT_CODEX_CONFIG:-}
      KB_AGENT_KEY: ${COMMUNITY_KB_AGENT_KEY:-}
      DISCORD_TOKEN: ${COMMUNITY_DISCORD_TOKEN:-}
    volumes:
      - ${CODEX_HOME_HOST:-./data/codex}:/codex
      - community-agent-work:/work
    restart: unless-stopped

  # Splits team work and assigns it by role; runs the weekday standup (pos.org).
  project-manager:
    profiles: ["agents"]
    build: ./worker
    depends_on: [api]
    environment:
      POS_URL: http://api:8000
      POS_AGENT_KEY: ${PM_AGENT_KEY:-}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      WORKER_CLAUDE_EFFORT: medium
    volumes:
      - ${CODEX_HOME_HOST:-./data/codex}:/codex
      - project-manager-work:/work
    restart: unless-stopped

volumes:
  pos-data:
  assistant-work:
  dev-agent-work:
  mail-agent-work:
  community-agent-work:
  project-manager-work:

