# PersonalOS stack. Works on the laptop as-is; on the server add
# docker-compose.prod.yml (see README).
services:
  api:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      # Agent instructions from git override the first version (AGENTS-SPEC 6).
      POS_AGENTS_REPO_DIR: /repo-agents
      # The tool library (docs/TOOLS.md): agents/*/tools and shared/tools, read-only.
      POS_TOOLS_REPO_DIR: /repo-tools
      # Runtimes: auto = codex first, claude (Opus 5.5) as fallback.
      POS_AGENT_RUNTIME: ${POS_AGENT_RUNTIME:-auto}
      POS_ENGINE_ORDER: ${POS_ENGINE_ORDER:-codex,claude}
      POS_CODEX_MODEL: ${POS_CODEX_MODEL:-}
      POS_CLAUDE_MODEL: ${POS_CLAUDE_MODEL:-claude-opus-5-5}
      POS_KNOWLAGE_URL: ${POS_KNOWLAGE_URL:-https://knowlage.obseum.cz}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      POS_WORKER_KEYS_DIR: /worker-keys
      # GitHub repositories (owner/name, comma-separated) whose `agent` issues go to the Dev agent.
      POS_DEV_REPOS: ${POS_DEV_REPOS:-ObseumEU/PersonalOS}
      # The agents' sandboxes (docs/SANDBOX.md); POS_SANDBOX_TOKEN comes from .env.
      POS_SANDBOX_URL: ${POS_SANDBOX_URL:-http://pos-sandbox:8200}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=5)"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 20s
    volumes:
      - pos-data:/data
      # Worker keys the core writes itself (agents as code, pos.agents_code): one folder per worker.
      - ./data/worker-keys:/worker-keys
      - ./agents:/repo-agents:ro
      - ./agents:/repo-tools/agents:ro
      - ./shared:/repo-tools/shared:ro
    # web's nginx proxies to this unique name: plain "api" is ambiguous on shared
    # networks (Nexus has an "api" too) and nginx would round-robin between them.
    networks:
      default:
        aliases:
          - pos-api
    restart: unless-stopped

  web:
    build: ./web
    depends_on:
      - api
    ports:
      - "${POS_PORT:-8080}:80"
    restart: unless-stopped

  # --- Deployer (AGENTS-SPEC step 6): ships what agents merge to main, reverts
  # it automatically when the constitution check, tests or health fail.
  # Runs on the server's checkout:  docker compose --profile deploy up -d
  deployer:
    profiles: ["deploy"]
    build:
      context: .
      dockerfile: ops/deployer.Dockerfile
    depends_on:
      api:
        condition: service_healthy
    working_dir: /repo
    command: ["python", "-m", "pos.selfdeploy", "--repo", "/repo", "--watch", "60"]
    environment:
      POS_URL: http://pos-api:8000
      POS_DEPLOYER_KEY: ${DEPLOYER_KEY:-}
      DEPLOY_HEALTH_URL: http://web/api/health
      DEPLOY_TEST_CMD: ${DEPLOY_TEST_CMD:-cd backend && pip install -q -e .[dev] && python -m pytest -q -n auto -p no:cacheprovider}
      DEPLOY_UP_CMD: ${DEPLOY_UP_CMD:-docker compose up -d --build api web}
    volumes:
      - .:/repo
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  agent-pool:
    profiles: ["agents"]
    build: ./worker
    command: ["python", "-m", "pos_worker.pool"]
    depends_on:
      api:
        condition: service_healthy
    environment:
      POS_URL: http://pos-api:8000
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      POOL_KEYS_DIR: /run/pos-keys
      # Each agent's effort, tools, caps and work folder come from its agents/<slug>/agent.json
      # ("effort", "profile"), served in /api/worker/me; the values below are the defaults.
      # The Software Engineer's GitHub tasks get a Haiku check first (pos_worker.triage): an unclear
      # issue gets one question instead of a run, another repository goes back; S tasks: low, $2.
      WORKER_TRIAGE: ${DEV_AGENT_TRIAGE:-1}
      WORKER_TRIAGE_REPOS: ${POS_DEV_REPOS:-ObseumEU/PersonalOS}
      WORKER_CLAUDE_MAX_USD_S: "2"
      WORKER_CODEX_CONFIG: 'model_reasoning_effort="medium"'
      WORKER_CLAUDE_EFFORT: medium
      WORKER_CLAUDE_MAX_USD: "1"
      WORKER_MAX_STEPS: "40"
      # Browser use (tool:browser, docs/BROWSER.md): Chromium starts on a run's first browser call; at most
      # BROWSER_MAX_CONCURRENT at once in this container, each restarted above BROWSER_MAX_MB (proportional
      # memory, PSS: a headless Chromium with Playwright MCP is ~500 MB on an ordinary page).
      BROWSER_MAX_CONCURRENT: ${POS_BROWSER_MAX_CONCURRENT:-3}
      BROWSER_MAX_MB: ${POS_BROWSER_MAX_MB:-1200}
      BROWSER_MAX_SCREENSHOTS: ${POS_BROWSER_MAX_SCREENSHOTS:-15}
      # Computer use (tool:computer): the desktop sandbox below, one session at a time.
      DESKTOP_URL: http://desktop:8100
      DESKTOP_TOKEN: ${POS_DESKTOP_TOKEN:-}
    # 4 runs (~220 MiB each) + 3 browsers (~500 MiB each, PSS) with room to spare.
    mem_limit: ${POS_POOL_MEM:-4g}
    networks:
      default:
      desktop:
    volumes:
      - ${CODEX_HOME_HOST:-./data/codex}:/codex
      - agent-pool-work:/work
      # The Software Engineer's clone (branch agent/dev, which the deployer promotes); the QA Reviewer
      # reads it (its profile allows only read tools). Same path as before, so its venv keeps working.
      - ${POS_DEV_WORK:-./data/dev-work}/PersonalOS:/work/PersonalOS
      - ./data/worker-keys/pool:/run/pos-keys:ro
    restart: unless-stopped

  # The desktop sandbox for computer use (ops/desktop): idle one small process; a run's session starts
  # Xvfb + fluxbox + Chromium and removes them at the end. Reached only by the agent pool (its own network).
  desktop:
    profiles: ["agents"]
    build: ./ops/desktop
    environment:
      DESKTOP_TOKEN: ${POS_DESKTOP_TOKEN:-}
      DESKTOP_IDLE_S: "300"
      DESKTOP_MAX_S: "1800"
    init: true  # reaps Chromium's helper processes after a session
    mem_limit: ${POS_DESKTOP_MEM:-1g}
    pids_limit: 512
    shm_size: 64m
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=256m
    networks:
      - desktop
    restart: unless-stopped

  # Every agent's own computer (docs/SANDBOX.md): this manager starts one container per agent from
  # pos-agent-sandbox:latest (ops/sandbox/image; built once on the host) on the internal network
  # `sandbox`, which has no route out; its egress proxy (here, alias sandbox-proxy) reaches only public
  # addresses and the api. The api calls the control API (pos-sandbox:8200) with POS_SANDBOX_TOKEN.
  sandbox:
    profiles: ["agents"]
    build: ./ops/sandbox
    # Named, so compose's own tag (<project>-sandbox) never lands on the agents' image.
    image: pos-sandbox-manager:latest
    environment:
      SANDBOX_TOKEN: ${POS_SANDBOX_TOKEN:-}
      SANDBOX_IMAGE: ${POS_SANDBOX_IMAGE:-pos-agent-sandbox:latest}
      SANDBOX_NETWORK: pos-sandbox
      SANDBOX_MAX_ACTIVE: ${POS_SANDBOX_MAX_ACTIVE:-3}
      SANDBOX_IDLE_S: ${POS_SANDBOX_IDLE_S:-900}
      SANDBOX_MEM: ${POS_SANDBOX_MEM:-2g}
      SANDBOX_CPUS: ${POS_SANDBOX_CPUS:-2}
      SANDBOX_QUOTA_MB: ${POS_SANDBOX_QUOTA_MB:-5120}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      default:
        aliases:
          - pos-sandbox
      sandbox:
        aliases:
          - sandbox-proxy
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  docker-proxy:
    profiles: ["sentinel"]
    image: tecnativa/docker-socket-proxy:${DOCKER_PROXY_TAG:-v0.5.0}
    environment:
      CONTAINERS: 1
      ALLOW_RESTARTS: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  sentinel:
    profiles: ["sentinel"]
    build: ./ops/sentinel
    depends_on:
      - docker-proxy
    environment:
      DOCKER_HOST: tcp://docker-proxy:2375
      SENTINEL_TOKEN: ${POS_SENTINEL_TOKEN:-}
      SENTINEL_POS_URL: ${SENTINEL_POS_URL:-http://pos-api:8000}
      SENTINEL_NEXUS_DSN: ${SENTINEL_NEXUS_DSN:-}
      SENTINEL_LITELLM_KEY: ${SENTINEL_LITELLM_KEY:-}
      SENTINEL_TEST_HOOK: ${SENTINEL_TEST_HOOK:-0}
    volumes:
      - sentinel-state:/state
      - ./.git:/repos/personalos:ro
    restart: unless-stopped

networks:
  desktop:
  # The sandboxes' network: internal (no route out) and the bridge without an address (the host is not
  # reachable either); the manager's proxy is the only way out.
  sandbox:
    name: pos-sandbox
    internal: true
    driver_opts:
      com.docker.network.bridge.inhibit_ipv4: "true"
    ipam:
      config:
        - subnet: 10.231.0.0/24

volumes:
  pos-data:
  sentinel-state:
  monitor-work:
  hr-agent-work:
  agent-pool-work:
  access-manager-work:
  agent-coach-work:
  assistant-work:
  dev-agent-work:
  mail-agent-work:
  community-agent-work:
  project-manager-work:
  asistent-vedeni-work:

