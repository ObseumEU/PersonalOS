server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 200m;

    # Resolve api through Docker's embedded DNS on every request (cached 10 s),
    # so recreating api alone never leaves this nginx on a stale IP (502).
    # A variable in proxy_pass forces the runtime lookup; with no URI part the
    # original request URI is passed through unchanged, as before. pos-api is a
    # compose alias on the default network only: plain "api" also matches Nexus's
    # api on the shared proxy network.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://pos-api:8000;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        # Workers long-poll /api/worker/next for up to 120 s.
        proxy_read_timeout 150s;
    }

    # Chat live stream (Server-Sent Events): no buffering, long-lived.
    location = /api/chat/stream {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # MCP (streamable HTTP): long-lived streams, no buffering.
    location /mcp {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # A2A: agent card and JSON-RPC endpoint.
    location ~ ^/(\.well-known/agent(-card)?\.json|a2a)$ {
        proxy_pass $api_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Built files carry a content hash in their name: cache them for good.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Single-page app: unknown paths go to index.html, which is always revalidated,
    # so a deploy shows up on the next page load (not after a browser's guess).
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
