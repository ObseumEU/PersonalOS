# One JSON line per request (Loki, deploy/observability): the request and upstream time in
# seconds, so Grafana's "PersonalOS výkon" has p50/p95 at the edge. No query string (tokens can
# ride in it), no cookies, no client address beyond the proxy's.
log_format pos_json escape=json '{"time":"$time_iso8601","level":"info","method":"$request_method",'
    '"path":"$uri","status":$status,"request_time":$request_time,'
    '"upstream_time":"$upstream_response_time","bytes":$body_bytes_sent,'
    '"upstream_status":"$upstream_status","ua":"$http_user_agent"}';

server {
    listen 80;
    root /usr/share/nginx/html;
    access_log /var/log/nginx/access.log pos_json;
    client_max_body_size 200m;

    # Resolve api through Docker's embedded DNS on every request (cached 10 s),
    # so recreating api alone never leaves this nginx on a stale IP (502).
    # A variable in proxy_pass forces the runtime lookup; with no URI part the
    # original request URI is passed through unchanged, as before. pos-api is a
    # compose alias on the default network only: plain "api" also matches Nexus's
    # api on the shared proxy network.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://pos-api:8000;

    # The installed app's page: only its own files, the api and the service worker; images may come
    # from anywhere over HTTPS (Markdown in a task), nothing else leaves the site.
    set $m_csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";

    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        # Workers long-poll /api/worker/next for up to 120 s.
        proxy_read_timeout 150s;
    }

    # Live streams (Server-Sent Events): the tab's one stream (pos.live) and the chat's.
    # No buffering, long-lived.
    location ~ ^/api/(chat/)?stream$ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # MCP (streamable HTTP): long-lived streams, no buffering.
    location /mcp {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # A2A: agent card and JSON-RPC endpoint.
    location ~ ^/(\.well-known/agent(-card)?\.json|a2a)$ {
        proxy_pass $api_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The installed app (docs/MOBILE.md). The service worker and the manifest are always revalidated,
    # so a deploy reaches installed apps at once; /m and /m/* are the app's own small page.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff";
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /m {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy $m_csp;
        try_files /m.html =404;
    }
    location /m/ {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy $m_csp;
        try_files /m.html =404;
    }
    location = /m.html {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy $m_csp;
        try_files $uri =404;
    }
    location /icons/ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }
    # The build's chunk graph (for the size check) is not served.
    location /.vite/ {
        return 404;
    }

    # report_html overviews (/reports/<uuid>): rendered by the api behind the login;
    # /reports and /reports/<week> stay the single-page app's.
    location ~ "^/reports/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$" {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Built files carry a content hash in their name: cache them for good.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Single-page app: unknown paths go to index.html, which is always revalidated,
    # so a deploy shows up on the next page load (not after a browser's guess).
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
